name: Build MLC native for Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-mlc:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install NDK
        run: sdkmanager --install "ndk;25.2.9519653"

      - name: Export Android NDK
        run: echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> "$GITHUB_ENV"

      - name: Build MLC native library
        run: |
          chmod +x llm/tools/build_mlc_android.sh
          llm/tools/build_mlc_android.sh

      - name: Archive lib
        uses: actions/upload-artifact@v4
        with:
          name: libmlcjni
          path: llm/src/main/jniLibs/arm64-v8a/libmlcjni.so
